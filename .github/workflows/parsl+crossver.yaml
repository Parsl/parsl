name: HTEX cross-version tests
on:
  pull_request:
  merge_group:

jobs:
  crossver:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v4
        with:
          python-version: "3.14"

      - name: Install Parsl
        run: pip install .

      - name: Run cross-version tests
        working-directory: parsl/tests
        run: python -m crossver --versions involving-here

      - name: Archive logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: crossver-logs-${{ github.sha }}
          path: .crossver/runs/
